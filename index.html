<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0d14" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Swipe songs, learn your taste, discover music." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swipe Sound" />
    <title>Swipe Sound</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />

  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <div id="app">
      <div id="status-banner" hidden></div>
      <main id="view" tabindex="-1"></main>
      <nav id="tabbar" aria-label="Main" hidden></nav>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="offline" hidden></div>

    <script type="module" src="js/main.js"></script>
